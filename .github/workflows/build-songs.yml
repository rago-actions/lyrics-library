name: Build songs.json

on:
  push:
    branches: [main]
    paths:
      - 'All-Songs/**'
      - 'scripts/build-songs.mjs'
      - 'merged.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-songs.mjs
      - name: Commit songs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs.json songs sitemap.xml robots.txt index.html
          git diff --staged --quiet || (git commit -m "Regenerate songs.json" && git push)
